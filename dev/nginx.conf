# Local-only reverse proxy for Flutter dev servers + backend.
# Usage:
#   sudo nginx -c $PWD/dev/nginx.conf -p $PWD
# Stop with:
#   sudo nginx -c $PWD/dev/nginx.conf -p $PWD -s stop

worker_processes 1;
error_log /tmp/food_orders_nginx_error.log;
pid /tmp/food_orders_nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/food_orders_nginx_access.log;

    # Flutter web + hot reload needs WebSocket upgrade support.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared proxy settings for all upstreams.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Needed for SSE: don't buffer the response, keep connection open.
    proxy_buffering off;
    proxy_read_timeout 1h;

    server {
        listen 80;
        server_name customer.local;

        location /api/ {
            # Real orders are well under 1 KB; bigger bodies get 413 and never
            # reach the backend (backend-request-body-limit).
            client_max_body_size 64k;
            # Strip the /api prefix before forwarding.
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3000;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }

    server {
        listen 80;
        server_name restaurant.local;

        location /api/ {
            client_max_body_size 64k;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:3000;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
