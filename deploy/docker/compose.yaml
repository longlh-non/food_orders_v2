# Docker Compose stack: Caddy (the only public door) + the backend.
# Run from anywhere:  docker compose -f deploy/docker/compose.yaml up -d
#
# NOTHING SECRET IS IN THIS FILE. Secrets reach the containers only through
# `env_file:` to files outside the repo (mode 600, owner root):
#   /etc/food-orders/backend.env   (see deploy/docker/backend.env.example)
#   /etc/food-orders/caddy.env     (see deploy/docker/caddy.env.example)
# Never use `environment:` or `docker run -e` for them (they land in shell
# history and compose files). Note that `env_file` values also show in
# `docker inspect`: anyone in the `docker` group is root-equivalent and must
# stay a short list. Never `${...}` interpolation for anything secret:
# Compose fills `${...}` from the shell and from a project `.env` file, which
# must not exist or hold secrets.
#
# HOST PREPARATION (the owner runs these; agents never use sudo):
#   sudo mkdir -p /var/lib/food-orders/data/images /etc/food-orders
#   sudo chown -R 10001:10001 /var/lib/food-orders/data     # the image's user
#   sudo chmod 700 /var/lib/food-orders/data
#   sudo mkdir -p /var/lib/food-orders/backups              # for the `backup` service
#   sudo chown 10001:10001 /var/lib/food-orders/backups
#   sudo chmod 700 /var/lib/food-orders/backups
#   web builds (deploy/build.sh) copied to /var/www/food-orders/customer and
#   /var/www/food-orders/restaurant (world-readable)
# Only 80 and 443 may ever be published. This stack and the systemd stack
# (docs/deploy.md) both want 80/443: run one of them, not both.

name: food-orders

services:
  backend:
    # DOCKER7: built on the server from the rsync'ed source.
    build:
      context: ../../backend
    restart: unless-stopped

    # NO `ports:` and NO `network_mode: host`, on purpose. The image listens
    # on 0.0.0.0 inside the container (BIND_ADDRESS), which is safe only
    # because nothing publishes it: the 64 KB body limit, the shared-password
    # gate and the cross-site guard all live in Caddy, so a published 3000
    # would skip all three. Docker's published ports also bypass ufw. Caddy
    # reaches it as backend:3000 over the private compose network.

    # Secrets (STAFF_*, SHOP_*, BANK_*): outside the repo, mode 600.
    env_file:
      - /etc/food-orders/backend.env

    # DOCKER6: host folders. /var/lib/food-orders/data holds orders.db and
    # images/ (ORDERS_DB=/data/orders.db and IMAGES_DIR=/data/images from the
    # image). Must be owned by uid 10001. Survives `docker compose down`.
    volumes:
      - type: bind
        source: /var/lib/food-orders/data
        target: /data
        bind:
          create_host_path: false  # a missing folder is an error, not an empty root-owned one

    # PID 1 reaps children and forwards signals.
    init: true
    # The server shuts down on SIGINT only (the image also sets this).
    stop_signal: SIGINT
    stop_grace_period: 20s

    # Hardening. Each line says why; the "unverified" ones were not run.
    read_only: true            # image files can't be changed; only /data (mounted) and /tmp are writable. UNVERIFIED: that the Dart AOT bundle and SQLite need no other writable path.
    tmpfs:
      - /tmp:size=16m,mode=1777  # scratch space in case SQLite or the runtime wants it. UNVERIFIED whether needed.
    cap_drop: [ALL]            # a plain server on port 3000 needs no Linux capability. UNVERIFIED.
    security_opt:
      - no-new-privileges:true # a process can't gain privileges through setuid binaries
    mem_limit: 384m            # 1 GB VM: leaves room for Caddy and the OS. UNVERIFIED that the backend stays under it.
    logging:
      driver: json-file
      options:                 # Docker keeps logs forever by default, and request logs hold order ids
        max-size: 10m
        max-file: "3"
    # healthcheck: inherited from the image (GET /menu every 30 s).

  caddy:
    image: caddy:2.6.2         # DOCKER5: pinned; the Caddyfile uses `basicauth` (renamed in newer Caddy). No digest yet.
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

    # The only published ports. No UDP/HTTP3 (docs/deploy.md 4.2).
    ports:
      - "80:80"
      - "443:443"

    # CUSTOMER_HOST, RESTAURANT_HOST, FOOD_ORDERS_AUTH_USER and
    # FOOD_ORDERS_AUTH_HASH come ONLY from this file. They cannot be made
    # "required" in Compose (`${VAR:?}` reads the shell and a project .env,
    # not env_file). It still fails closed: an EMPTY host makes Caddy refuse to
    # load the Caddyfile (checked with Caddy 2.6.2); an UNSET host falls back
    # to the local-only names (localhost, restaurant.localhost), which never
    # request a public certificate; unset credentials give 401 on every request.
    env_file:
      - /etc/food-orders/caddy.env

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: /var/www/food-orders/customer
        target: /srv/customer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/www/food-orders/restaurant
        target: /srv/restaurant
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data       # certificates and ACME account: MUST persist (CA rate limits)
      - caddy_config:/config

    # Hardening (all UNVERIFIED against Caddy 2.6.2 in this setup).
    read_only: true            # Caddy writes only to /data and /config (volumes). UNVERIFIED: that it needs no other path.
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE       # bind 80 and 443 inside the container; the only capability kept
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # DOCKER9 + DOCKER10: one backup round on request, never started by a plain
  # `docker compose up` (profile). Run it:
  #   docker compose -f deploy/docker/compose.yaml run --rm backup
  # Schedule (the owner installs it; agents never touch crontab), daily 03:30:
  #   30 3 * * * umask 077; docker compose -f /PATH/TO/deploy/docker/compose.yaml run --rm backup >> /var/log/food-orders-backup.log 2>&1
  # (umask 077 keeps the log private. Build the image once by hand first, so
  # cron never runs apt-get unattended: docker compose -f ... --profile tools build backup.
  # Keep /PATH/TO owned by root: cron runs as root and builds from those files.)
  # Run it before every backend update (schema steps cannot be undone).
  # Alternative: sqlite3 on the host running deploy/backup.sh on the same folders.
  backup:
    profiles: [tools]
    build:
      context: ../..           # repo root: the Dockerfile copies deploy/backup.sh
      dockerfile: deploy/docker/backup.Dockerfile
    # NO `ports:`, no `restart:` (a one-shot job).
    user: "10001:10001"
    # The script never uses the network: keep this job off the compose network
    # so it cannot reach backend:3000 around Caddy (the build is unaffected).
    network_mode: none

    environment:               # none of these is secret
      ORDERS_DB: /data/orders.db
      IMAGES_DIR: /data/images
      BACKUP_DIR: /backups
      KEEP: "14"

    volumes:
      # Same folder as the backend. Read-write on purpose: `sqlite3 .backup`
      # opens the database and needs the folder writable for its side files
      # (journal / -wal / -shm). UNVERIFIED: that .backup works through the
      # bind mount while the backend is running (locking across containers).
      - type: bind
        source: /var/lib/food-orders/data
        target: /data
        bind:
          create_host_path: false
      # Backups live on the host, outside the repo, the image and any named
      # volume that `docker compose down -v` would delete. Owner prepares it
      # (see HOST PREPARATION).
      - type: bind
        source: /var/lib/food-orders/backups
        target: /backups
        bind:
          create_host_path: false

    read_only: true            # UNVERIFIED: that backup.sh needs no other writable path
    tmpfs:
      - /tmp:size=16m,mode=1777  # UNVERIFIED whether needed (sqlite3 temp files)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
